# Reef with Docker Compose. Copy next to your data and run `docker compose up -d`, then open
# http://localhost:4920 and create the first account: it becomes the site administrator.
#
# Every setting is a REEF_* variable (deploy/reef.conf.example lists them all), or mount a
# TOML file at /etc/reef/reef.conf. Behind a reverse proxy that terminates TLS (nginx, Caddy,
# Traefik): set REEF_SITE_URL to the https address and REEF_HTTP_TRUSTED_PROXIES to the
# proxy's address or network, and keep plain HTTP between the proxy and Reef. Stock
# actions/runner binaries need Reef on port 80 or 443 (they drop the port from --url), so a
# proxy is also what makes CI work.
services:
  reef:
    image: yadvlabs/reef:latest
    restart: unless-stopped
    ports:
      - "4920:4920" # HTTP: web UI, API, git over HTTP, runners
      - "4922:4922" # git over SSH
    environment:
      REEF_SITE_URL: http://localhost:4920
      # Behind a TLS-terminating proxy:
      # REEF_SITE_URL: https://reef.example.com
      # REEF_HTTP_TRUSTED_PROXIES: 172.16.0.0/12   # the proxy's address or the Docker network it is on
      # Let people create their own accounts (the first account can always be created).
      REEF_ALLOW_SIGNUP: "false"
      # PostgreSQL instead of the SQLite file under /var/lib/reef (uncomment the service below):
      # REEF_DATABASE_URL: postgres://reef@postgres:5432/reef?sslmode=disable
      # REEF_DATABASE_PASSWORD: change-me
    volumes:
      - reef-data:/var/lib/reef
      # A host directory instead of the named volume must be writable by uid 4920:
      #   mkdir -p data && sudo chown 4920:4920 data
      # - ./data:/var/lib/reef
      # A configuration file. Bind-mounting a host directory over /etc/reef hides the
      # image's example; write one with: docker run --rm yadvlabs/reef config example > reef.conf
      # - ./reef.conf:/etc/reef/reef.conf:ro
    # depends_on:
    #   postgres:
    #     condition: service_healthy

