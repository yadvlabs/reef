[package]
name = "reef"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Reef: GitHub-compatible source hosting"

[[bin]]
name = "reef"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
reef-api = { version = "0.1.0", path = "../../crates/reef-api" }
reef-core = { version = "0.1.0", path = "../../crates/reef-core" }
reef-db = { version = "0.1.0", path = "../../crates/reef-db" }
reef-git = { version = "0.1.0", path = "../../crates/reef-git" }
reef-ssh = { version = "0.1.0", path = "../../crates/reef-ssh" }
sd-notify = "0.4"
serde = "1.0.229"
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
