[package]
name = "reef-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
ammonia = "4.2.0"
async-compression = { version = "0.4.48", features = ["tokio", "gzip"] }
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bytes = "1.12.1"
comrak = "0.55.0"
reef-core = { version = "0.1.2", path = "../reef-core" }
reef-db = { version = "0.1.2", path = "../reef-db" }
reef-git = { version = "0.1.2", path = "../reef-git" }
futures = "0.3.34"
http = "1.5.0"
http-body = "1"
http-body-util = "0.1.5"
hyper = "1"
mime_guess = "2.0.5"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rust-embed = "8.12.0"
serde = "1.0.229"
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
sha2_010 = { package = "sha2", version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
hmac = "0.12"
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
aes-gcm = "0.10"
crypto_box = { version = "0.9", features = ["seal"] }
hex = "0.4.3"
rand = "0.10.3"
rand_legacy = { package = "rand", version = "0.8" }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
reef-actions = { version = "0.1.2", path = "../reef-actions" }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "compression-gzip", "decompression-gzip", "set-header", "timeout", "catch-panic", "request-id", "limit"] }
tracing = "0.1.44"
pgp = "0.20"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
prometheus = { version = "0.14", default-features = false, features = ["process"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
ipnet = "2.12"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
